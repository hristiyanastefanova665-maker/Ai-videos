<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>Kadrie Birthday Poster</title>
<style>
@font-face { font-family: "GreatVibes"; src: url(fonts/GreatVibes-Regular.ttf); }
@font-face { font-family: "Cormorant"; src: url(fonts/CormorantGaramond.ttf); font-weight: 300 700; }
@font-face { font-family: "Cormorant"; src: url(fonts/CormorantGaramond-Italic.ttf); font-style: italic; font-weight: 300 700; }

:root {
  --ink: #f5ece0;
  --gold: linear-gradient(100deg, #c8933a 0%, #f2d38a 25%, #fff3cf 45%, #e2b65e 65%, #f6dc98 82%, #c8933a 100%);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1000px; height: 1414px; background: var(--ink); overflow: hidden; }

.poster { position: relative; width: 1000px; height: 1414px; overflow: hidden; background: #6b4a33; }

/* the photo, full width; only the empty floor below the shoes runs off the bottom edge */
.photo {
  position: absolute; left: 0; top: 150px; width: 1000px; height: 1334px;
  background: url(assets/family.png) center / 100% 100% no-repeat;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 60px);
          mask-image: linear-gradient(180deg, transparent 0, #000 60px);
}
/* upward extension: the photo's own top edge (wall, slats, balloons) continued and softened */
#ext { position: absolute; left: 0; top: 0; width: 1000px; height: 260px; }
/* gentle warm shading so the text reads; fades out above the heads */
.shade-top {
  position: absolute; inset: 0 0 auto 0; height: 330px;
  background: linear-gradient(180deg, rgba(45, 26, 16, .66) 0, rgba(45, 26, 16, .55) 200px, rgba(45, 26, 16, 0) 330px);
}
#fx { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- all text together, large, above the family ---------- */
.text { position: absolute; left: 0; right: 0; top: 8px; text-align: center; z-index: 5; }
.line1 {
  font-family: "Cormorant"; font-weight: 600; font-size: 52px; letter-spacing: 1.5px; line-height: 1;
  color: #fff8ec; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(30, 15, 8, .85), 0 0 2px rgba(30, 15, 8, .6);
}
.name {
  display: inline-block; font-family: "GreatVibes"; font-size: 142px; line-height: .95;
  padding: 50px 70px 60px; margin: -50px 0 -60px;
  background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 2px rgba(40, 20, 10, .7)) drop-shadow(0 4px 10px rgba(30, 15, 8, .8));
}
.wish {
  margin-top: 0; font-family: "Cormorant"; font-style: italic; font-weight: 600; font-size: 56px; line-height: 1;
  color: #fff8ec; text-shadow: 0 2px 10px rgba(30, 15, 8, .9), 0 0 2px rgba(30, 15, 8, .7);
}
</style>
</head>
<body>
<div class="poster">
  <canvas id="ext" width="1000" height="260"></canvas>
  <div class="photo"></div>
  <div class="shade-top"></div>
  <canvas id="fx" width="2000" height="2828"></canvas>

  <div class="text">
    <div class="line1">Честит рожден ден,</div>
    <div class="name">Кадрие!</div>
    <div class="wish">Пожелаваме ти много здраве,<br>щастие и късмет!</div>
  </div>
</div>

<script>
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
ctx.scale(2, 2);

function star(x, y, s, a) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 1.8);
  g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s * 1.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#c29a4a'; ctx.beginPath();
  ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s);
  ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s); ctx.fill();
  ctx.restore();
}
// sparkles kept clear of the text and of every face
[[70, 50, 8], [930, 50, 8]]
  .forEach(([x, y, s]) => star(x, y, s, .9));
const img = new Image();
img.onload = () => {
  const e = document.getElementById('ext').getContext('2d');
  e.filter = 'blur(14px)';
  // top 26 source rows (~24px on the poster) stretched up to fill the space above the photo
  e.drawImage(img, 0, 0, 1086, 26, -30, -30, 1060, 320);
  document.fonts.ready.then(() => document.body.dataset.ready = '1');
};
img.src = 'assets/family.png';
</script>
</body>
</html>
