<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>Kadrie Birthday Poster</title>
<style>
@font-face { font-family: "GreatVibes"; src: url(fonts/GreatVibes-Regular.ttf); }
@font-face { font-family: "Cormorant"; src: url(fonts/CormorantGaramond.ttf); font-weight: 300 700; }
@font-face { font-family: "Cormorant"; src: url(fonts/CormorantGaramond-Italic.ttf); font-style: italic; font-weight: 300 700; }

:root {
  --ink: #22102b;
  --gold: linear-gradient(100deg, #b07a26 0%, #f0cf7c 22%, #fff4cf 40%, #dcae55 60%, #f7dd96 80%, #b07a26 100%);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1000px; height: 1414px; background: var(--ink); overflow: hidden; }

.poster { position: relative; width: 1000px; height: 1414px; overflow: hidden; background: var(--ink); }

/* full-bleed photo, no frame; its top edge melts into the dark band */
.photo {
  position: absolute; left: 0; top: 81px; width: 1000px; height: 1333px;
  background: url(assets/family.png) center / 100% 100% no-repeat;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 70px);
          mask-image: linear-gradient(180deg, transparent 0, #000 70px);
}
/* cinematic shading for legibility: top-left and bottom only, faces stay untouched */
.shade-top {
  position: absolute; inset: 0 0 auto 0; height: 330px;
  background:
    radial-gradient(ellipse 75% 100% at 22% 0%, rgba(34, 16, 43, .78), transparent 75%),
    linear-gradient(180deg, rgba(34, 16, 43, .9) 0, rgba(34, 16, 43, .55) 110px, rgba(34, 16, 43, 0) 245px);
}
.shade-bottom {
  position: absolute; inset: auto 0 0 0; height: 150px;
  background: linear-gradient(0deg, rgba(34, 16, 43, .92) 0, rgba(34, 16, 43, .6) 55px, rgba(34, 16, 43, 0) 100%);
}
#fx { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- heading (top-left, clear of heads and the neon crown) ---------- */
.title { position: absolute; left: 56px; top: 34px; z-index: 5; }
.line1 {
  font-family: "Cormorant"; font-weight: 500; font-size: 44px; letter-spacing: 1.5px; line-height: 1;
  color: #f8eedd; text-shadow: 0 2px 10px rgba(20, 6, 26, .8);
}
.name {
  font-family: "GreatVibes"; font-size: 128px; line-height: 1.1; margin: -4px 0 0 34px; padding: 0 30px 0 0;
  background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 14px rgba(255, 214, 140, .35)) drop-shadow(0 3px 5px rgba(20, 6, 26, .75));
}

/* ---------- wish ---------- */
.wish {
  position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; z-index: 5;
  font-family: "Cormorant"; font-style: italic; font-weight: 500; font-size: 34px; letter-spacing: .4px;
  color: #f8eedd; text-shadow: 0 2px 10px rgba(20, 6, 26, .9);
}
</style>
</head>
<body>
<div class="poster">
  <div class="photo"></div>
  <div class="shade-top"></div>
  <div class="shade-bottom"></div>
  <canvas id="fx" width="2000" height="2828"></canvas>

  <div class="title">
    <div class="line1">Честит рожден ден,</div>
    <div class="name">Кадрие!</div>
  </div>

  <div class="wish">Пожелаваме ти много здраве, щастие и късмет!</div>
</div>

<script>
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
ctx.scale(2, 2);

// soft warm bokeh only in the dark top band (right side, beside the title)
for (let i = 0; i < 18; i++) {
  const x = 560 + rnd() * 430, y = rnd() * 120, r = 5 + rnd() * 16;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(255,220,160,${.2 + rnd() * .2})`); g.addColorStop(1, 'rgba(255,220,160,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
// fine gold dust in the top band
for (let i = 0; i < 90; i++) {
  const x = rnd() * 1000, y = rnd() * 150, r = .4 + rnd() * 1.2;
  ctx.fillStyle = `rgba(255,${215 + rnd() * 30},${150 + rnd() * 60},${.3 + rnd() * .5})`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function star(x, y, s, a) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 1.8);
  g.addColorStop(0, 'rgba(255,236,190,.75)'); g.addColorStop(1, 'rgba(255,236,190,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s * 1.8, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3cf'; ctx.beginPath();
  ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s);
  ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s); ctx.fill();
  ctx.restore();
}
// sparkles kept clear of the text and of every face
[[612, 40, 11], [880, 30, 8], [960, 92, 6], [180, 1392, 6], [820, 1392, 6]]
  .forEach(([x, y, s]) => star(x, y, s, .9));
document.fonts.ready.then(() => document.body.dataset.ready = '1');
</script>
</body>
</html>
