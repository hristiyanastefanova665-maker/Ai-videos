<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>Kadrie Birthday Poster</title>
<style>
@font-face { font-family: "GreatVibes"; src: url(fonts/GreatVibes-Regular.ttf); }
@font-face { font-family: "Cormorant"; src: url(fonts/CormorantGaramond.ttf); font-weight: 300 700; }
@font-face { font-family: "Cormorant"; src: url(fonts/CormorantGaramond-Italic.ttf); font-style: italic; font-weight: 300 700; }

:root {
  --cream: #fbf5ec;
  --ink: #24102e;
  --gold: linear-gradient(100deg, #6e470e 0%, #9c6c1c 30%, #b4842c 50%, #8e5f16 70%, #6e470e 100%);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1000px; height: 1414px; background: var(--cream); overflow: hidden; }
.poster { position: relative; width: 1000px; height: 1414px; overflow: hidden; background: var(--cream); }

/* geometry: photo scale 0.8 -> 870 x 1159, top 320; shoes end at ~1412 */
.photo {
  position: absolute; left: 100px; top: 320px; width: 870px; height: 1159px;
  background: url(assets/family.png) center / 100% 100% no-repeat;
}
#sides { position: absolute; inset: 0; width: 1000px; height: 1414px; }

/* solid champagne panel for the text; melts into the wall above the heads */
.panel {
  position: absolute; inset: 0 0 auto 0; height: 400px;
  background: linear-gradient(180deg, var(--cream) 0, var(--cream) 340px, rgba(251, 245, 236, 0) 400px);
}

.text { position: absolute; left: 0; right: 0; top: 14px; text-align: center; z-index: 5; }
.line1 {
  font-family: "Cormorant"; font-weight: 700; font-size: 60px; letter-spacing: 1px; line-height: 1;
  color: var(--ink);
}
.name {
  display: inline-block; font-family: "GreatVibes"; font-size: 152px; line-height: .95;
  padding: 40px 70px 50px; margin: -36px 0 -50px;
  background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 1.6px #6e470e;
}
.wish {
  margin-top: 2px; font-family: "Cormorant"; font-style: italic; font-weight: 700; font-size: 60px; line-height: 1;
  color: var(--ink);
}
</style>
</head>
<body>
<div class="poster">
  <canvas id="sides" width="1000" height="1414"></canvas>
  <div class="photo"></div>
  <div class="panel"></div>

  <div class="text">
    <div class="line1">Честит рожден ден,</div>
    <div class="name">Кадрие!</div>
    <div class="wish">Пожелаваме ти много здраве,<br>щастие и късмет!</div>
  </div>
</div>

<script>
// The photo is narrower than the poster: continue its outer edges by mirroring
// the last strip of wall (left) and balloons (right). People are never mirrored.
const img = new Image();
img.onload = () => {
  const c = document.getElementById('sides').getContext('2d');
  const top = 320, h = 1159;
  // left: the plain white wall at the photo's edge, widened
  c.drawImage(img, 0, 0, 40, 1448, 0, top, 101, h);
  // right: a thin mirrored strip of the balloon garland
  c.save(); c.translate(970, 0); c.scale(-1, 1);
  c.drawImage(img, 1086 - 38, 0, 38, 1448, -30, top, 30, h); c.restore();
  document.fonts.ready.then(() => document.body.dataset.ready = '1');
};
img.src = 'assets/family.png';
</script>
</body>
</html>
