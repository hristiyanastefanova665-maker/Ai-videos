<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel cover</title>
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/playfair-display/700-italic.css">
<style>
:root{--r:#C66F8C;--k:#171318;--c:#FFF9F5;--b:#E8D7CF;--g:#D6B27C}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Montserrat;background:radial-gradient(ellipse at 50% 55%,#d58aa2 0%,#C66F8C 50%,#a9556f 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,249,245,.16) 2px,transparent 2.5px);background-size:44px 44px}
.a{position:absolute}
.ring{left:90px;top:620px;width:900px;height:900px;border-radius:50%;border:5px dashed var(--g);opacity:.9}
.disc{left:150px;top:680px;width:780px;height:780px;border-radius:50%;background:var(--k);box-shadow:0 30px 80px rgba(23,19,24,.35)}
#av{left:-30px;top:520px;width:1140px;-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 85%,transparent 97%)}
.kick{left:0;top:285px;width:1080px;text-align:center;font:800 34px Montserrat;letter-spacing:.32em;color:var(--c)}
.title{z-index:5;left:0;top:350px;width:1080px;text-align:center;font:900 132px/0.98 Montserrat;color:var(--c);text-shadow:0 10px 0 rgba(23,19,24,.18)}
.title span{color:var(--k)}
.tag{left:50%;transform:translateX(-50%) rotate(-3deg);top:1360px;white-space:nowrap;display:flex;gap:18px;align-items:center;background:var(--c);border:6px solid var(--k);border-radius:999px;padding:22px 44px;font:900 50px Montserrat;color:var(--k);box-shadow:0 14px 0 rgba(23,19,24,.25)}
.tag b{color:var(--r)}
.tag i{width:14px;height:14px;border-radius:50%;background:var(--g);display:inline-block}
.ic{position:absolute;filter:drop-shadow(0 10px 0 rgba(23,19,24,.18))}
.ic svg{width:100%;height:100%}
.brand{left:0;top:1525px;width:1080px;text-align:center}
.brand .n{font:700 italic 78px 'Playfair Display';color:var(--c)}
.brand .c{font:800 26px Montserrat;letter-spacing:.55em;color:var(--k);margin-top:4px;padding-left:.55em}
</style>
</head>
<body>
<div id="s">
  <div class="dots"></div>
  <div class="a kick">ЗАПОЗНАЙ СЕ С МЕН</div>
  <div class="a title">AI + ПОСТЕРИ<br><span>ОТ НУЛАТА</span></div>
  <div class="a ring"></div>
  <div class="a disc"></div>
  <img id="av" class="a" src="assets/avatar.png">
  <div class="ic" id="i1" style="left:70px;top:720px;width:170px;height:170px"></div>
  <div class="ic" id="i2" style="left:850px;top:690px;width:160px;height:160px"></div>
  <div class="ic" id="i3" style="left:880px;top:1120px;width:140px;height:140px"></div>
  <div class="ic" id="i4" style="left:60px;top:1130px;width:140px;height:140px"></div>
  <div class="ic" id="i5" style="left:250px;top:640px;width:80px;height:80px"></div>
  <div class="a tag">AI <i></i> ДИЗАЙН <i></i> <b>БИЗНЕС</b></div>
  <div class="a brand"><div class="n">Hristiyana</div><div class="c">CREATIVE</div></div>
</div>
<script src="icons.js"></script>
<script>
const I=window.ICON;
i1.innerHTML=I.chip(); i2.innerHTML=I.image(); i3.innerHTML=I.printer(); i4.innerHTML=I.palette(); i5.innerHTML=I.sparkle();
i1.style.transform='rotate(-10deg)'; i2.style.transform='rotate(8deg)'; i3.style.transform='rotate(-6deg)'; i4.style.transform='rotate(10deg)';
Promise.all([document.fonts.ready, av.decode()]).then(()=>window.ready=true);
</script>
</body>
</html>
